<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="panel">
      <header class="panel__header">
        <h1>To-Do App</h1>
      </header>
      <form class="todo-form" data-todo-form>
        <input
          type="text"
          name="task"
          data-task-input
          placeholder="Add a focus item..."
          autocomplete="off"
        />
        <button type="submit">Create</button>
      </form>
      <div class="filters" data-filter-group></div>
      <ul class="todo-list" data-task-list></ul>
      <div class="status-row">
        <span data-status-count></span>
        <button class="ghost" data-clear-completed>Clear completed</button>
      </div>
    </section>
  </main>

  <script type="module" src="src/app.js" defer></script>
</body>
</html>
